name: Render video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título principal del video"
        required: true
        type: string
        default: "3 señales de que tu VPS necesita mejorar"
      script:
        description: "Guion completo en español"
        required: false
        type: string
      audio_url:
        description: "URL temporal de archivo de audio. No introduzcas claves API."
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas de render
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
      - name: Instalar compiladores para Qwen
        if: ${{ inputs.audio_url == '' }}
        run: sudo apt-get install -y build-essential libopenblas-dev
      - name: Instalar HyperFrames y GSAP
        run: npm install --no-save hyperframes@latest gsap @fontsource/anton@5.3.0
      - name: Preparar Qwen3-TTS 0.6B CustomVoice
        if: ${{ inputs.audio_url == '' }}
        run: |
          git init tools/qwen3-tts
          git -C tools/qwen3-tts remote add origin https://github.com/gabriele-mastrapasqua/qwen3-tts.git
          git -C tools/qwen3-tts fetch --depth 1 origin ef339be58a778b062e1c14382347964552eae007
          git -C tools/qwen3-tts checkout --detach FETCH_HEAD
          make -C tools/qwen3-tts -j2 blas
          bash tools/qwen3-tts/download_model.sh --model small --dir "$GITHUB_WORKSPACE/models/qwen3-tts-0.6b-customvoice"
          test -x tools/qwen3-tts/qwen_tts
          test -s models/qwen3-tts-0.6b-customvoice/config.json
          test -s models/qwen3-tts-0.6b-customvoice/speech_tokenizer/config.json
      - name: Guardar guion
        env:
          VIDEO_SCRIPT: ${{ inputs.script }}
        run: |
          if [ -n "$VIDEO_SCRIPT" ]; then
            printf '%s' "$VIDEO_SCRIPT" > narration.txt
          else
            cat > narration.txt <<'EOF'
          ¿Tu web tarda en cargar? Cuando una página se queda pensando, tus visitantes no esperan: se van y buscan otra opción.
          Muchas veces el problema está en un servidor que ya no responde al ritmo de tu proyecto.
          Un VPS bien configurado te ofrece recursos dedicados, más control y una base estable para crecer.
          En cloudservicegm preparamos tu infraestructura desde cero. Optimizamos el servidor, reforzamos la seguridad, configuramos SSL y dejamos listos WordPress, bases de datos y aplicaciones web.
          También cuidamos los accesos y los servicios que mantienen tu proyecto disponible.
          No se trata solo de tener un servidor: se trata de que tu web responda cuando tus clientes la necesitan.
          Síguenos para aprender sobre VPS, rendimiento y seguridad. Y si necesitas ayuda con tu infraestructura, escríbenos.
          EOF
          fi
          test -s narration.txt
      - name: Descargar audio temporal
        if: ${{ inputs.audio_url != '' }}
        run: |
          AUDIO_URL="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("inputs", {}).get("audio_url", ""))')"
          if [[ ! "$AUDIO_URL" =~ ^https://[a-z0-9-]+\.trycloudflare\.com/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::La URL de audio no tiene el formato temporal esperado."
            exit 1
          fi
          echo "::add-mask::$AUDIO_URL"
          curl --http1.1 --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
            --connect-timeout 30 --max-time 600 \
            "$AUDIO_URL" --output narration.input
          test -s narration.input
          ffmpeg -hide_banner -loglevel error -y -i narration.input \
            -ar 24000 -ac 1 -c:a pcm_s16le narration.wav
          rm -f narration.input
          test -s narration.wav
          curl --http1.1 --fail --silent --show-error --request POST \
            --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --connect-timeout 20 --max-time 90 \
            "$AUDIO_URL/complete"
          echo "Audio recibido, convertido y confirmado."
      - name: Generar narración de respaldo con Qwen3-TTS Ryan 0.6B
        if: ${{ inputs.audio_url == '' }}
        run: |
          python3 generate_voice.py \
            --input narration.txt \
            --output narration.wav \
            --engine tools/qwen3-tts/qwen_tts \
            --model models/qwen3-tts-0.6b-customvoice \
            --threads 4
          test -s narration.wav
      - name: Comprobar duración mínima de 35 segundos
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narration.wav)
          echo "Duración generada: ${DURATION}s"
          awk -v d="$DURATION" 'BEGIN { if (d < 35) { print "El audio dura menos de 35 segundos. Amplía el guion."; exit 1 } }'
      - name: Transcribir narración
        run: |
          npx hyperframes transcribe narration.wav --model large-v3 --language es
          test -s transcript.json
      - name: Crear proyecto HyperFrames
        run: |
          npx hyperframes init render-project --non-interactive --example blank --skip-skills
          mkdir -p render-project/assets
          cp node_modules/gsap/dist/gsap.min.js render-project/assets/gsap.min.js
          cp node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2 render-project/assets/anton.woff2
          cp narration.wav render-project/assets/narration.wav
      - name: Construir composición animada
        env:
          VIDEO_TITLE: ${{ inputs.title || '3 señales de que tu VPS necesita mejorar' }}
        run: |
          python3 build_video.py \
            --transcript transcript.json \
            --audio narration.wav \
            --template template/index.template.html \
            --output render-project/index.html \
            --assets render-project/assets \
            --title "$VIDEO_TITLE"
      - name: Validar composición
        run: npx hyperframes lint render-project
      - name: Renderizar MP4
        working-directory: render-project
        run: npx hyperframes render --output cloudservicegm-video.mp4 --fps 30 --quality standard --workers 2
      - name: Publicar video descargable
        uses: actions/upload-artifact@v4
        with:
          name: cloudservicegm-video
          path: render-project/cloudservicegm-video.mp4
          if-no-files-found: error
          retention-days: 7
