name: Validate manual studio infrastructure

on:
  push:
    paths:
      - "manual_studio_server.py"
      - "build_manual_video.py"
      - "manual_compositions/**"
      - "web/manual.html"
      - "run_manual_studio.bat"
      - ".github/workflows/manual-render.yml"
      - ".github/workflows/validate-manual-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the isolated manual studio and every design
        run: |
          python -m py_compile manual_studio_server.py build_manual_video.py transcript_utils.py build_video.py
          find manual_compositions -name design.py -print0 | xargs -0 -r python -m py_compile
      - name: Validate registry and execute each composition design
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          from build_video import SFX_IDS
          data=json.loads(Path("manual_compositions/registry.json").read_text(encoding="utf-8"))
          assert data.get("schema_version")==1
          items=data.get("compositions")
          assert isinstance(items,list) and items
          for item in items:
              assert item.get("status")=="ready"
              cid=item.get("id","")
              source=Path("manual_compositions")/cid/"design.py"
              assert source.is_file(), source
              spec=importlib.util.spec_from_file_location("manual_design_"+cid,source)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              design=module.build_design(55.733,[],[],"Prueba de validación")
              scenes=design.get("scenes",[])
              events=design.get("sfx_events",[])
              assert 3 <= len(scenes) <= 10, (cid,len(scenes))
              assert len(events) >= len(scenes), (cid,len(events))
              assert all(event["id"] in SFX_IDS for event in events), cid
              assert abs(scenes[0]["start"]) <= .05, cid
              assert abs(scenes[-1]["end"]-55.733) <= .1, cid
              for a,b in zip(scenes,scenes[1:]):
                  assert abs(a["end"]-b["start"]) <= .03, (cid,a,b)
                  assert isinstance(a.get("markup"),str) and a["markup"]
                  assert isinstance(a.get("animation"),str) and a["animation"]
              print("COMPOSITION_SMOKE_OK",cid,len(scenes),"scenes",len(events),"SFX")
          print("MANUAL_CATALOG_OK",len(items),"ready designs")
          PY
      - name: Validate isolated HTML template and manual page
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          for filename in ("web/manual.html","manual_compositions/base.template.html"):
              parser=HTMLParser()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              parser.close()
              print("HTML_PARSE_OK",filename)
          template=Path("manual_compositions/base.template.html").read_text(encoding="utf-8")
          for marker in ("{{DURATION}}","{{DESIGN_CSS}}","{{SCENES}}","{{SCENE_ANIMS}}","{{CAPTIONS}}","{{CAPTION_ANIMS}}","{{CAPTION_CSS}}"):
              assert marker in template,marker
          print("MANUAL_TEMPLATE_MARKERS_OK")
          PY
      - name: Check builder CLI
        run: python build_manual_video.py --help
      - name: Confirm the three render paths remain separate
        run: |
          test -f .github/workflows/render.yml
          test -f .github/workflows/ai-video.yml
          test -f .github/workflows/manual-render.yml
          grep -q 'template/index.template.html' .github/workflows/render.yml
          grep -q 'template/dynamic.template.html' .github/workflows/ai-video.yml
          grep -q 'build_manual_video.py' .github/workflows/manual-render.yml
          echo "THREE_WORKFLOWS_SEPARATE_OK"
