<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#080d15;color:#fff;font-family:Arial,sans-serif}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#080d15}
.manual-scene{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;opacity:0;visibility:hidden;transform-origin:center center}
.manual-scene-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.manual-scene-kicker{position:absolute;top:105px;left:70px;right:70px;text-align:center;z-index:15;font-size:22px;font-weight:800;letter-spacing:6px;text-transform:uppercase}
.manual-scene-headline{position:absolute;top:170px;left:75px;right:75px;z-index:15;text-align:center;font-size:76px;line-height:.98;font-weight:900;text-transform:uppercase}
.manual-scene-detail{position:absolute;top:355px;left:100px;right:100px;z-index:15;text-align:center;font-size:27px;line-height:1.25}
.manual-scene-index{position:absolute;bottom:55px;left:68px;z-index:20;font-size:17px;letter-spacing:5px;opacity:.55}
{{DESIGN_CSS}}{{CAPTION_CSS}}</style></head>
<body><div id="root" data-composition-id="root" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
{{SCENES}}{{CAPTIONS}}<audio id="narration" data-start="0" data-track-index="0" src="./assets/narration.wav"></audio>
<script src="./assets/gsap.min.js"></script><script>
const D={{DURATION}};const tl=gsap.timeline({paused:true});
{{SCENE_ANIMS}}{{CAPTION_ANIMS}}
tl.set({}, {}, D);window.__timelines=window.__timelines||{};window.__timelines["root"]=tl;
</script></div></body></html>
